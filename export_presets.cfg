html/head_include="<link rel='manifest' href='manifest.webmanifest'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
<meta name='apple-mobile-web-app-title' content='Abducted'>
<meta name='theme-color' content='#000000'>
<style>
body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#rotate-hint { display: none; position: fixed; inset: 0; z-index: 10; background: #1a0a33; color: #ffd100; font: bold 22px sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
@media (orientation: portrait) and (pointer: coarse) { #rotate-hint { display: flex; } }
#fullscreen-tip { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 11; max-width: 90%; box-sizing: border-box; padding: 6px 12px; background: rgba(26, 10, 51, 0.92); border: 2px solid #ffd100; border-radius: 8px; color: #fff; font: 14px sans-serif; text-align: center; }
#fullscreen-tip small { display: block; margin-top: 2px; color: #ffd100; font-size: 12px; }
</style>
<script>
// Phones: full screen in landscape wherever the browser allows it.
// Android, iPad and desktop browsers: any tap goes full screen (again after leaving it).
// iPhone Safari has no full screen for pages, so it gets a tip to add the game to the home screen,
// which opens it with no browser bars (the manifest and apple-mobile-web-app tags above).
(function () {
	var ua = navigator.userAgent;
	var iphone = /iPhone|iPod/.test(ua);
	var inApp = /FBAN|FBAV|Instagram|Line[/]|TikTok|Twitter|MicroMessenger/i.test(ua);
	var installed = navigator.standalone === true || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;

	// LINE opens links in its own browser, which can't go full screen. This asks LINE to use the phone's browser.
	if (/Line[/]/.test(ua) && location.search.indexOf('openExternalBrowser') === -1) {
		location.replace(location.pathname + (location.search ? location.search + '&' : '?') + 'openExternalBrowser=1' + location.hash);
		return;
	}

	// draw under the notch too, the game letterboxes itself
	var viewport = document.querySelector('meta[name=viewport]');
	if (viewport && viewport.content.indexOf('viewport-fit') === -1) viewport.content += ', viewport-fit=cover';

	function isFullscreen() {
		return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
	}

	function goFullscreen() {
		if (installed || isFullscreen()) return;
		var page = document.documentElement;
		var ask = page.requestFullscreen || page.webkitRequestFullscreen || page.webkitRequestFullScreen || page.mozRequestFullScreen || page.msRequestFullscreen;
		if (!ask) return;
		try {
			var done = ask.call(page, { navigationUI: 'hide' });
			if (done && done.then) done.then(lockLandscape).catch(function () {});
			else setTimeout(lockLandscape, 300);
		} catch (e) {}
	}

	function lockLandscape() {
		if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
	}

	function showTip(text, how) {
		var tip = document.createElement('div');
		tip.id = 'fullscreen-tip';
		tip.textContent = text;
		var small = document.createElement('small');
		small.textContent = how + '  (tap to close)';
		tip.appendChild(small);
		function close(e) {
			if (e) { e.preventDefault(); e.stopPropagation(); }
			if (tip.parentNode) tip.parentNode.removeChild(tip);
		}
		tip.addEventListener('touchend', close);
		tip.addEventListener('click', close);
		document.body.appendChild(tip);
		setTimeout(close, 15000);
	}

	window.addEventListener('DOMContentLoaded', function () {
		var hint = document.createElement('div');
		hint.id = 'rotate-hint';
		hint.textContent = 'Turn your phone sideways to play';
		document.body.appendChild(hint);
		if (installed) return;
		if (inApp) showTip('For full screen, open this page in Chrome or Safari', 'Use the menu (... or the share button) and pick Open in browser');
		else if (iphone) showTip('For full screen on iPhone, add the game to your Home Screen', 'Tap Share, then Add to Home Screen, then play from the new icon');
	});

	window.addEventListener('touchend', goFullscreen);
	window.addEventListener('click', function () { if (matchMedia('(pointer: coarse)').matches) goFullscreen(); });
})();
</script>"
html/canvas_resize_policy=2
